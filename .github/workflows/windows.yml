name: Windows Build And Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build And Test
        shell: pwsh
        run: ./scripts/Build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DiffBeacon-NuGet-beta
          path: artifacts/packages/*.nupkg
      - name: Publish Portable Build
        shell: pwsh
        run: ./scripts/Publish.ps1
      - name: Packaged Native UI Regression Smoke
        shell: pwsh
        timeout-minutes: 3
        run: |
          $portable = Join-Path $env:RUNNER_TEMP 'DiffBeacon-portable-smoke'
          Expand-Archive -LiteralPath './artifacts/DiffBeacon-Windows-x64.zip' -DestinationPath $portable
          $screenshot = Join-Path $env:RUNNER_TEMP 'DiffBeacon.png'
          $stdout = Join-Path $portable 'smoke.stdout.log'
          $stderr = Join-Path $portable 'smoke.stderr.log'
          $app = Start-Process -FilePath (Join-Path $portable 'DiffBeacon.exe') -ArgumentList '--smoke', ('"{0}"' -f $screenshot) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -Wait -PassThru
          Get-Content -LiteralPath $stdout, $stderr
          if ($app.ExitCode -ne 0) { throw "Packaged UI smoke failed with exit $($app.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: DiffBeacon-Windows-x64
          path: artifacts/DiffBeacon-Windows-x64.zip
