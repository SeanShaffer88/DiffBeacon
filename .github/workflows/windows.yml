name: Windows Build And Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build And Test
        shell: pwsh
        run: ./scripts/Build.ps1
      - name: Native UI Regression Smoke
        shell: pwsh
        run: |
          dotnet ./src/DiffBeacon.App/bin/Release/net10.0-windows/DiffBeacon.dll --smoke "$env:RUNNER_TEMP/DiffBeacon.png"
          if ($LASTEXITCODE -ne 0) { throw 'UI smoke failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: DiffBeacon-NuGet-beta
          path: artifacts/packages/*.nupkg
      - name: Publish Portable Build
        shell: pwsh
        run: ./scripts/Publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DiffBeacon-Windows-x64
          path: artifacts/DiffBeacon-Windows-x64.zip
